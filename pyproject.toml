[tool.poetry]
name = "investment-project-calculator"
version = "0.1.0"
description = "Калькулятор оценки эффективности инвестиционного проекта"
authors = ["Shoxrux Yuldashov <deagleshox@mail.ru>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
matplotlib = "3.7.1"
numpy = "1.24.3"
openpyxl = "3.1.2"
pandas = "2.0.2"
pillow = "9.5.0"

[tool.poetry.group.dev.dependencies]
black = "23.3.0"
flake8 = "7.0.0"
isort = "5.13.2"
djlint = "1.34.1"
pytest = "8.3.2"
pydocstyle = "6.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

max-complexity = 10
per-file-ignores = { "__init__.py" = "F401" }

[tool.flake8]
line-length = 79
extend-ignore = ["E203"]
exclude = [
    ".git",
    "*/__pycache__/",
    "*/env",
    "*/venv",
    "tests/",
    ".pytest_cache",
    ".vscode",
    ".idea"
]

[tool.flake8.ignore]
W503 = true
F811 = true
R503 = true
R504 = true
R505 = true

[tool.black]
line-length = 79
include = '\.pyi?$'
extend-exclude = '''
/(
  | .vscode
  | .idea
)/
'''

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
